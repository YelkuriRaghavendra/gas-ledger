name: db-backup

on:
  schedule:
    - cron: "30 17 * * *" # 23:00 IST daily
  workflow_dispatch:

permissions:
  contents: read

env:
  PG_IMAGE: postgres:17

jobs:
  dump:
    name: 1. Dump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      file: ${{ steps.name.outputs.file }}
    steps:
      - name: Set backup file name
        id: name
        run: echo "file=backup-$(date -u +%F).dump" >> "$GITHUB_OUTPUT"

      - name: pg_dump (3 attempts)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_FILE: ${{ steps.name.outputs.file }}
        run: |
          for attempt in 1 2 3; do
            echo "pg_dump attempt $attempt"
            if docker run --rm --user "$(id -u):$(id -g)" \
                 -e SUPABASE_DB_URL -v "$PWD:/out" "$PG_IMAGE" \
                 sh -c 'pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "/out/$0"' "$BACKUP_FILE"; then
              ls -lh "$BACKUP_FILE"
              exit 0
            fi
            rm -f "$BACKUP_FILE"
            sleep $((attempt * 20))
          done
          echo "pg_dump failed after 3 attempts" >&2
          exit 1

      - name: Encrypt dump for hand-off
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_FILE: ${{ steps.name.outputs.file }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$BACKUP_FILE.gpg" "$BACKUP_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: ${{ steps.name.outputs.file }}.gpg
          retention-days: 1

  verify:
    name: 2. Verify
    needs: dump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dump

      - name: Decrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_FILE: ${{ needs.dump.outputs.file }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            -o "$BACKUP_FILE" --decrypt "$BACKUP_FILE.gpg"

      - name: Check dump is a valid archive
        env:
          BACKUP_FILE: ${{ needs.dump.outputs.file }}
        run: |
          test -s "$BACKUP_FILE"
          docker run --rm -v "$PWD:/out" "$PG_IMAGE" pg_restore --list "/out/$BACKUP_FILE" > /dev/null
          echo "dump OK"

  upload:
    name: 3. Upload to R2
    needs: [dump, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dump

      - name: Decrypt dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_FILE: ${{ needs.dump.outputs.file }}
        run: |
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            -o "$BACKUP_FILE" --decrypt "$BACKUP_FILE.gpg"

      - name: Upload (3 attempts)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_FILE: ${{ needs.dump.outputs.file }}
        run: |
          for attempt in 1 2 3; do
            echo "upload attempt $attempt"
            if aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/" \
                 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "upload failed after 3 attempts" >&2
          exit 1
