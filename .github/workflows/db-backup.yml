name: db-backup

on:
  schedule:
    - cron: "30 17 * * *" # 23:00 IST daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: postgres:17
    steps:
      - name: Set backup file name
        run: echo "BACKUP_FILE=backup-$(date -u +%F).dump" >> "$GITHUB_ENV"

      - name: Dump database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          for attempt in 1 2 3; do
            echo "pg_dump attempt $attempt"
            if docker run --rm --user "$(id -u):$(id -g)" \
                 -e SUPABASE_DB_URL -v "$PWD:/out" "$PG_IMAGE" \
                 sh -c 'pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges -Fc -f "/out/$0"' "$BACKUP_FILE"; then
              exit 0
            fi
            rm -f "$BACKUP_FILE"
            sleep $((attempt * 20))
          done
          echo "pg_dump failed after 3 attempts" >&2
          exit 1

      - name: Verify dump
        run: |
          test -s "$BACKUP_FILE"
          ls -lh "$BACKUP_FILE"
          docker run --rm -v "$PWD:/out" "$PG_IMAGE" pg_restore --list "/out/$BACKUP_FILE" > /dev/null

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          for attempt in 1 2 3; do
            echo "upload attempt $attempt"
            if aws s3 cp "$BACKUP_FILE" "s3://$R2_BUCKET/" \
                 --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "upload failed after 3 attempts" >&2
          exit 1
